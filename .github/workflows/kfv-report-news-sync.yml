name: KFV / ÖFB Aufstellung und Spielberichte synchronisieren

on:
  workflow_dispatch:

  schedule:
    # Freitag, Samstag und Sonntag alle 15 Minuten.
    # Österreichische Zeit inkl. Sommer-/Winterzeit.
    # Zeitraum 07:00 bis 22:45 Uhr.
    - cron: "*/15 7-22 * * 5,6,0"
      timezone: "Europe/Vienna"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Aufstellung und Schiedsrichter prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Europe/Vienna
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      REPORT_SYNC_CONCURRENCY: "2"
      REPORT_NAVIGATION_TIMEOUT: "45000"

      # Spielbericht ab ca. 30 Minuten vor Spielbeginn berücksichtigen.
      REPORT_PRE_KICKOFF_MINUTES: "35"

      # Bis 15 Minuten nach Anstoß nochmals aktualisieren,
      # falls Aufstellung oder Schiedsrichter verspätet veröffentlicht wurden.
      REPORT_POST_KICKOFF_MINUTES: "15"

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Firebase-Zugang prüfen
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT fehlt."
            exit 1
          fi

          echo "Firebase-Service-Account vorhanden."

      - name: Projekt und Spielbericht-Sync prüfen
        run: npm run sync:check

      - name: Aufstellung, Schiedsrichter und Spielbericht synchronisieren
        run: npm run sync:reports