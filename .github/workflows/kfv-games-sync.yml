name: KFV / ÖFB Spieltermine und Kalender synchronisieren

on:
  workflow_dispatch:
  schedule:
    # Dreimal täglich in österreichischer Lokalzeit.
    # GitHub berücksichtigt damit Sommer- und Winterzeit automatisch.
    - cron: "15 6,13,19 * * *"
      timezone: "Europe/Vienna"

permissions:
  contents: read

concurrency:
  group: kfv-oefb-games-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Spieltermine und Kalender aktualisieren
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Vienna
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      CI: "true"
      SYNC_MODE: games
      RUN_DAILY_TASKS: "false"
      RUN_DUPLICATE_CLEANUP: "false"

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Projekt und Spieltermin-Sync prüfen
        run: npm run sync:check

      - name: Firebase-Zugang prüfen
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Das Repository-Secret FIREBASE_SERVICE_ACCOUNT fehlt."
            exit 1
          fi
          echo "Firebase-Service-Account ist vorhanden."

      - name: Spieltermine und Kalender synchronisieren
        run: npm run sync:games
