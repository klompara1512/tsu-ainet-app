name: KFV / ÖFB Tabellen Freitag bis Sonntag

on:
  workflow_dispatch:

  schedule:
    # Freitag, Samstag und Sonntag um 20:00 Uhr (Österreich Sommerzeit)
    - cron: "0 18 * * 5,6,0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Tabellen synchronisieren
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Europe/Vienna
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Wochenende oder österreichischen Feiertag prüfen
        id: gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/weekend-holiday-gate.cjs

      - name: Node.js einrichten
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten installieren
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Projekt prüfen
        if: steps.gate.outputs.run == 'true'
        run: npm run sync:check

      - name: Tabellen synchronisieren
        if: steps.gate.outputs.run == 'true'
        run: npm run sync:tables

      - name: Übersprungen protokollieren
        if: steps.gate.outputs.run != 'true'
        run: |
          echo "Tabellen-Synchronisierung heute nicht erforderlich."
          echo "Grund: ${{ steps.gate.outputs.reason }}"