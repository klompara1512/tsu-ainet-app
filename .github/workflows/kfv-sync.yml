name: KFV / ÖFB Synchronisierung

on:
  workflow_dispatch:

  schedule:
    # Alle 30 Minuten
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: kfv-oefb-sync
  cancel-in-progress: true

jobs:
  sync:
    name: KFV / ÖFB Daten synchronisieren
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Projekt und Synchronisierung prüfen
        run: npm run sync:check

      - name: Firebase-Zugang prüfen
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Das Repository-Secret FIREBASE_SERVICE_ACCOUNT fehlt."
            exit 1
          fi

          echo "Firebase-Service-Account ist vorhanden."

      - name: KFV / ÖFB synchronisieren
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CI: "true"
          TZ: Europe/Vienna
        run: npm run sync:full
