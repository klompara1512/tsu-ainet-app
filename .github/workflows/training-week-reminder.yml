name: Nachwuchs-Training Erinnerung

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-week-reminder
  cancel-in-progress: true

jobs:
  remind:
    name: Fehlende Nachwuchstrainings prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Vienna
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIRESTORE_PREFER_REST: "true"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    steps:
      - name: Projekt laden
        uses: actions/checkout@v5
      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Firebase-Zugang prüfen
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Repository-Secret FIREBASE_SERVICE_ACCOUNT fehlt."
            exit 1
          fi
          node -e 'const x=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT); if(!x.project_id||!x.client_email||!x.private_key) throw new Error("Firebase-Service-Account unvollständig"); console.log("Firebase-Service-Account JSON ist gültig für Projekt:", x.project_id)'
      - name: Trainingsplanung prüfen und Trainer erinnern
        run: node scripts/training-week-reminder.cjs
