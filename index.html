<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="description" content="Offizielle Vereinsplattform der TSU Ainet mit Spielen, Tabellen, Mannschaften, Ankündigungen, Terminen, Sponsoren und Fanshop." />
    <meta name="theme-color" content="#07101f" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07101f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TSU Ainet" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      // Einmalige Selbstheilung bei veralteten PWA-Dateien nach einem Update.
      window.addEventListener("error", async (event) => {
        const message = String(event.message || "");
        const source = String(event.filename || "");
        const isAssetFailure = /Loading chunk|Failed to fetch dynamically imported module|Importing a module script failed/i.test(message)
          || /\/assets\/.*\.(js|css)(\?|$)/i.test(source);
        if (!isAssetFailure || sessionStorage.getItem("tsu-pwa-recovery") === "1") return;
        sessionStorage.setItem("tsu-pwa-recovery", "1");
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
        } finally {
          window.location.reload();
        }
      }, true);
    </script>
    <title>TSU Ainet Fußball</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
