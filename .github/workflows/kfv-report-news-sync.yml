name: KFV / ÖFB Spielberichte synchronisieren

on:
  workflow_dispatch:

  schedule:
    # Freitag, Samstag und Sonntag um 20:00 Uhr (Österreich Sommerzeit)
    - cron: "0 18 * * 5,6,0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Spielberichte synchronisieren

    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Europe/Vienna
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      REPORT_SYNC_CONCURRENCY: "2"
      REPORT_NAVIGATION_TIMEOUT: "45000"

      REPORT_PRE_KICKOFF_MINUTES: "60"
      REPORT_POST_KICKOFF_MINUTES: "300"

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Firebase-Zugang prüfen
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Das Repository-Secret FIREBASE_SERVICE_ACCOUNT fehlt."
            exit 1
          fi

          echo "Firebase-Service-Account ist vorhanden."

      - name: Projekt und Spielbericht-Synchronisierung prüfen
        run: npm run sync:check

      - name: Spielberichte synchronisieren
        run: npm run sync:reports