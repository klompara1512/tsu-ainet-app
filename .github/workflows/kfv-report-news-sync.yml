name: KFV / ÖFB Spielberichte, Aufstellungen und Liveticker synchronisieren

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kfv-oefb-report-news-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Spielberichte und Aufstellungen synchronisieren
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Europe/Vienna
      CI: "true"
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      REPORT_SYNC_CONCURRENCY: "2"
      REPORT_NAVIGATION_TIMEOUT: "45000"
      REPORT_PRE_KICKOFF_MINUTES: "60"
      REPORT_POST_KICKOFF_MINUTES: "720"
      REPORT_FORCE_WINDOW_MINUTES: "10080"

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Firebase-Zugang prüfen
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Das Repository-Secret FIREBASE_SERVICE_ACCOUNT fehlt."
            exit 1
          fi

      - name: Spielbericht-Sync-Code prüfen
        run: node --check scripts/kfv-report-news-sync.cjs

      - name: Spielberichte, Aufstellungen und Liveticker synchronisieren
        run: npm run sync:reports

      # WICHTIG: Die App liest Spiele bevorzugt aus publicSnapshots/football.
      # Nach einer Korrektur von gameId/oefbMatchId/reportUrl muss deshalb der
      # kompakte öffentliche Snapshot sofort neu veröffentlicht werden.
      - name: Öffentlichen Fußball-Datenstand aktualisieren
        run: npm run sync:public-snapshot
