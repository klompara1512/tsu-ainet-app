name: KFV / ÖFB Spielberichte, Aufstellungen und Liveticker synchronisieren

on:
  # Automatisch wird dieser Sync bereits von der Smart-Synchronisierung gestartet.
  # Dieser Workflow bleibt als manueller Notfall-/Testlauf erhalten und verursacht
  # dadurch keine zusätzlichen täglichen GitHub-Minuten.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kfv-oefb-report-news-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Spielberichte und Aufstellungen synchronisieren
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Vienna
      CI: "true"
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIRESTORE_PREFER_REST: "true"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      REPORT_SYNC_CONCURRENCY: "2"
      REPORT_NAVIGATION_TIMEOUT: "45000"
      REPORT_PRE_KICKOFF_MINUTES: "10080"
      REPORT_POST_KICKOFF_MINUTES: "720"
      REPORT_FORCE_WINDOW_MINUTES: "10080"

    steps:
      - name: Projekt laden
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Puppeteer-Browser cachen
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Firebase-Zugang prüfen
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Das Repository-Secret FIREBASE_SERVICE_ACCOUNT fehlt."
            exit 1
          fi
          node -e 'const x=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT); if(!x.project_id||!x.client_email||!x.private_key) throw new Error("Firebase-Service-Account unvollständig"); console.log("Firebase-Service-Account JSON ist gültig für Projekt:", x.project_id)'

      - name: Spielbericht-Sync-Code prüfen
        run: node --check scripts/kfv-report-news-sync.cjs

      - name: Spielberichte, Aufstellungen und Liveticker synchronisieren
        shell: bash
        run: |
          set +e
          npm run sync:reports
          status=$?
          if [ $status -ne 0 ]; then
            echo "::warning::Erster Spielbericht-Sync fehlgeschlagen. Ein einmaliger Retry folgt in 20 Sekunden."
            sleep 20
            npm run sync:reports
            status=$?
          fi
          exit $status

      - name: Ergebnis-News veröffentlichen
        run: npm run news:auto-results

      - name: Öffentlichen Fußball-Datenstand aktualisieren
        run: npm run sync:public-snapshot
