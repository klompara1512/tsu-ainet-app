name: KFV / ÖFB Spielpläne und Ergebnisse synchronisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

concurrency:
  group: kfv-oefb-games-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Vienna
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Projekt und Spiele-Sync prüfen
        run: npm run sync:check

      - name: Spielpläne und Ergebnisse synchronisieren
        run: npm run sync:games

      - name: Heimspiel-Aufgaben automatisch aktualisieren
        run: npm run sync:home-tasks
