name: Automatische Ergebnis-News

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsu-auto-result-news
  cancel-in-progress: true

jobs:
  publish:
    name: Ergebnis-News veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Vienna
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      RESULT_NEWS_LOOKBACK_HOURS: "48"
    steps:
      - name: Projekt laden
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Firebase-Zugang prüfen
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Das Repository-Secret FIREBASE_SERVICE_ACCOUNT fehlt."
            exit 1
          fi
      - name: Ergebnis-News-Code prüfen
        run: node --check scripts/auto-result-news.cjs
      - name: Neue Ergebnis-News veröffentlichen
        run: npm run news:auto-results
