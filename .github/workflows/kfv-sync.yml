name: KFV / ÖFB Core-Daten synchronisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

concurrency:
  group: kfv-oefb-core-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Vienna
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SYNC_MODE: core
      RUN_DAILY_TASKS: "false"
      RUN_DUPLICATE_CLEANUP: "false"

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Projekt und Core-Sync prüfen
        run: npm run sync:check

      - name: Spielpläne, Ergebnisse und Tabellen synchronisieren
        run: npm run sync:core
