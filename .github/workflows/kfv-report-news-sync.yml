name: KFV / ÖFB Spielberichte im Spielzeitfenster synchronisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "10,40 * * * *"

concurrency:
  group: kfv-oefb-report-news-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Vienna
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      REPORT_SYNC_CONCURRENCY: "2"
      REPORT_NAVIGATION_TIMEOUT: "45000"
      REPORT_PRE_KICKOFF_MINUTES: "60"
      REPORT_POST_KICKOFF_MINUTES: "300"

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Projekt und Spielbericht-Sync prüfen
        run: npm run sync:check

      - name: Berichte nur eine Stunde vor bis fünf Stunden nach Anstoß synchronisieren
        run: npm run sync:reports
