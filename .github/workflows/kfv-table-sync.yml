name: KFV / ÖFB Tabellen täglich

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Tabellen synchronisieren
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Europe/Vienna
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Firebase-Zugang prüfen
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Das Repository-Secret FIREBASE_SERVICE_ACCOUNT fehlt."
            exit 1
          fi
          echo "Firebase-Service-Account ist vorhanden."

      - name: Projekt und Tabellen-Synchronisierung prüfen
        run: npm run sync:check

      - name: Tabellen synchronisieren
        run: npm run sync:tables
