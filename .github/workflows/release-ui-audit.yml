name: Release UI Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  ui-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:ui-audit
      - run: npm run build
