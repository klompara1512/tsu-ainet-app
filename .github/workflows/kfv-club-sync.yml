name: KFV / ÖFB Vereinsdaten synchronisieren

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Vereinsdaten synchronisieren
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Vienna
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      CLUB_SYNC_CONCURRENCY: "2"
      MAX_CLUB_PAGES: "40"
    steps:
      - name: Projekt laden
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Firebase-Zugang prüfen
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Das Repository-Secret FIREBASE_SERVICE_ACCOUNT fehlt."
            exit 1
          fi
      - name: Projekt und Club-Sync prüfen
        run: npm run sync:check
      - name: Vereinslogos und Vereinsdaten synchronisieren
        run: npm run sync:clubs
