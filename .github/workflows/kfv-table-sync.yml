name: KFV / ÖFB Tabellen Freitag bis Sonntag und an Feiertagen

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

concurrency:
  group: kfv-oefb-table-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Vienna
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Wochenende oder österreichischen Feiertag prüfen
        id: gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/weekend-holiday-gate.cjs

      - name: Node.js einrichten
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Projekt und Tabellen-Sync prüfen
        if: steps.gate.outputs.run == 'true'
        run: npm run sync:check

      - name: Tabellen synchronisieren
        if: steps.gate.outputs.run == 'true'
        run: npm run sync:tables

      - name: Übersprungen protokollieren
        if: steps.gate.outputs.run != 'true'
        run: echo "Tabellen-Sync heute nicht erforderlich. Grund ${{ steps.gate.outputs.reason }}."
