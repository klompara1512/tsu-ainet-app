name: KFV / ÖFB Aufstellung und Schiedsrichter intelligent synchronisieren

on:
  workflow_dispatch:
  schedule:
    # Täglich alle 30 Minuten zwischen 07:00 und 22:30 Uhr.
    # So werden auch Nachtrags-, Cup- und Wochentagsspiele erfasst.
    # Das Script öffnet ÖFB nur, wenn ein TSU-Ainet-Spiel unvollständige Daten hat.
    # Spielort/Schiedsrichter werden bis zu 7 Tage vor Anpfiff abgeholt; nach Anpfiff wird bis zu 12 Stunden nachgeholt.
    - cron: "*/30 7-22 * * *"
      timezone: "Europe/Vienna"

permissions:
  contents: read

concurrency:
  group: kfv-oefb-report-news-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Vienna
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      REPORT_SYNC_CONCURRENCY: "2"
      REPORT_NAVIGATION_TIMEOUT: "45000"
      REPORT_PRE_KICKOFF_MINUTES: "10080"
      REPORT_POST_KICKOFF_MINUTES: "720"
      REPORT_FORCE_WINDOW_MINUTES: "720"
      # Ein manueller Start umgeht das Smart-Gate; SPG-Namen mit „Ainet/…“ werden korrekt erkannt.
      REPORT_FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Firebase-Zugang prüfen
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Das Repository-Secret FIREBASE_SERVICE_ACCOUNT fehlt."
            exit 1
          fi
          echo "Firebase-Service-Account ist vorhanden."

      - name: Projekt und Spielbericht-Synchronisierung prüfen
        run: npm run sync:check

      - name: Aufstellung und Schiedsrichter intelligent synchronisieren
        run: npm run sync:reports
