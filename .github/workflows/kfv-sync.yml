name: KFV / ÖFB Daten synchronisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

concurrency:
  group: kfv-oefb-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Europe/Vienna
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      RUN_DAILY_TASKS: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
      RUN_DUPLICATE_CLEANUP: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Projekt und Sync prüfen
        run: npm run sync:check

      - name: Offizielle ÖFB-/KFV-Daten synchronisieren
        run: npm run sync:kfv
