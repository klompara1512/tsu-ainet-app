name: ÖFB U17 Tabelle exakt

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"

permissions:
  contents: read

concurrency:
  group: oefb-u17-table-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-table:
    name: U17 Tabelle synchronisieren
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Vienna
      TABLE_TEAM: U17
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Projekt laden
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Firebase-Zugang prüfen
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Repository-Secret FIREBASE_SERVICE_ACCOUNT fehlt."
            exit 1
          fi
      - name: U17 Parser Selbsttest
        run: node scripts/exact-team-table-selftest.cjs U17
      - name: Exakte U17 Tabelle synchronisieren
        run: node scripts/exact-team-table-sync.cjs U17
